apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Kind-specific patches: nip.io hostnames, local image pull policy,
# and keycloak realm config for local development.
#
# Note: EnvoyProxy is in envoy-gateway-system namespace and is applied
# separately by the kind:up task. The GatewayClass parametersRef patch
# is in each Kind overlay (not here) because kustomize Component patches
# cannot target resources from sibling components.
resources:
  - httproute-minio.yaml
  - httproute-minio-api.yaml

components:
  - ../../../components/gateway-envoy
  - ../../../components/demo/gateway

configMapGenerator:
  - name: keycloak-realm
    files:
      - memory-service-realm.json
    behavior: replace
  - name: memory-service-config
    behavior: merge
    literals:
      - KEYCLOAK_FRONTEND_URL=http://keycloak.127.0.0.1.nip.io:8080
      - OIDC_TOKEN_ISSUER=http://keycloak.127.0.0.1.nip.io:8080/realms/memory-service
      # Tokens are issued with the external nip.io URL as the issuer claim
      - MEMORY_SERVICE_OIDC_ISSUER=http://keycloak.127.0.0.1.nip.io:8080/realms/memory-service
      - MEMORY_SERVICE_OIDC_ALLOWED_AUDIENCES=memory-service
      - MEMORY_SERVICE_OIDC_ALLOWED_CLIENTS=memory-service-client,frontend,developer-frontend
      # Discover OIDC config via the internal cluster address (issuer URL is not reachable in-cluster)
      - MEMORY_SERVICE_OIDC_DISCOVERY_URL=http://keycloak:8080/realms/memory-service
      - MEMORY_SERVICE_ATTACHMENTS_S3_EXTERNAL_ENDPOINT=http://minio-api.127.0.0.1.nip.io:8080
      - MEMORY_SERVICE_ENCRYPTION_KIND=dek

secretGenerator:
  - name: memory-service-secret
    behavior: merge
    literals:
      - MEMORY_SERVICE_ENCRYPTION_DEK_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

patches:
  # Link GatewayClass to the Kind-specific EnvoyProxy (hostNetwork + ClusterIP)
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: GatewayClass
      name: eg
    patch: |
      - op: add
        path: /spec/parametersRef
        value:
          group: gateway.envoyproxy.io
          kind: EnvoyProxy
          name: kind-proxy
          namespace: envoy-gateway-system
  # Assign nip.io hostnames to each HTTPRoute
  - target:
      kind: HTTPRoute
      name: chat-quarkus
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["chat.127.0.0.1.nip.io"]
  - target:
      kind: HTTPRoute
      name: memory-service
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["memory-service.127.0.0.1.nip.io"]
  - target:
      kind: HTTPRoute
      name: keycloak
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["keycloak.127.0.0.1.nip.io"]
  - target:
      kind: HTTPRoute
      name: grafana
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["grafana.127.0.0.1.nip.io"]
  - target:
      kind: HTTPRoute
      name: prometheus
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["prometheus.127.0.0.1.nip.io"]
  - target:
      kind: HTTPRoute
      name: minio
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["minio.127.0.0.1.nip.io"]
  - target:
      kind: HTTPRoute
      name: minio-api
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["minio-api.127.0.0.1.nip.io"]
  # Use IfNotPresent so kind-loaded images aren't pulled from a registry
  - target:
      kind: Deployment
      name: memory-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/chirino/memory-service:latest
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: MEMORY_SERVICE_API_KEYS_ANALYTICS_SMOKE, value: analytics-smoke-key}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: MEMORY_SERVICE_TRUSTED_USER_ID_CLIENTS, value: analytics_smoke}
  - target:
      kind: Deployment
      name: clickhouse-processor
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/chirino/memory-service:latest
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: chat-quarkus
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/chirino/memory-service-chat-quarkus:latest
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: minio
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
