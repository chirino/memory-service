apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse-processor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: clickhouse-processor}
  template:
    metadata:
      labels: {app: clickhouse-processor}
    spec:
      serviceAccountName: memory-service
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: processor
          image: ghcr.io/chirino/memory-service:latest@sha256:c03c98f1b7ab2a04f2db5d3573aed02273a1a229890a7602e39e31667933b345
          command: ["/memory-service"]
          args: ["process", "clickhouse"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: health, containerPort: 8081, protocol: TCP}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - {name: MEMORY_SERVICE_GRPC_ENDPOINT, value: memory-service:8080}
            - {name: MEMORY_SERVICE_PROCESS_CLIENT_ID, value: clickhouse_processor}
            - {name: MEMORY_SERVICE_API_KEY, value: clickhouse-processor-key}
            - {name: MEMORY_SERVICE_PROCESS_ALLOW_INSECURE_GRPC, value: "true"}
            - {name: MEMORY_SERVICE_PROCESS_AFTER_CURSOR, value: start}
            - {name: MEMORY_SERVICE_CLICKHOUSE_ADDRESS, value: clickhouse:9000}
            - {name: MEMORY_SERVICE_CLICKHOUSE_PROTOCOL, value: native}
            - {name: MEMORY_SERVICE_CLICKHOUSE_DATABASE, value: memory_service}
            - {name: MEMORY_SERVICE_CLICKHOUSE_USERNAME, value: memory_service_analytics}
            - {name: MEMORY_SERVICE_CLICKHOUSE_PASSWORD_FILE, value: /run/clickhouse/password}
            - {name: MEMORY_SERVICE_CLICKHOUSE_ALLOW_INSECURE, value: "true"}
            - {name: MEMORY_SERVICE_CLICKHOUSE_PAYLOAD_MODE, value: metadata}
          volumeMounts:
            - {name: secret, mountPath: /run/clickhouse, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: secret
          secret:
            secretName: clickhouse-analytics-secret
            items:
              - key: password
                path: password
