apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - deployment.yaml

configMapGenerator:
  - name: memory-service-config
    behavior: merge
    literals:
      - MEMORY_SERVICE_ROLES_ADMIN_CLIENTS=clickhouse_analytics

secretGenerator:
  - name: memory-service-secret
    behavior: merge
    literals:
      - MEMORY_SERVICE_API_KEYS_CLICKHOUSE_ANALYTICS=clickhouse-analytics-key
