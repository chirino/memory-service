apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - deployment.yaml
  - service.yaml

# The chat demo uses Keycloak usernames as the visible sharing identity, so
# Memory Service must derive its user ID from preferred_username (not sub).
configMapGenerator:
  - name: memory-service-config
    behavior: merge
    literals:
      - MEMORY_SERVICE_OIDC_USER_ID_CLAIM=/preferred_username

secretGenerator:
  - name: chat-quarkus-secret
    literals:
      - MEMORY_SERVICE_CLIENT_API_KEY=agent-api-key-1
      - KEYCLOAK_CLIENT_SECRET=change-me
  - name: memory-service-secret
    behavior: merge
    literals:
      - MEMORY_SERVICE_API_KEYS_AGENT=agent-api-key-1
