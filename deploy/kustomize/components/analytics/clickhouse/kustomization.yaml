apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - statefulset.yaml
  - service.yaml
  - pvc.yaml
  - network-policy.yaml

configMapGenerator:
  - name: clickhouse-init
    files:
      - init.sql

secretGenerator:
  - name: clickhouse-analytics-secret
    literals:
      - username=memory_service_analytics
      - password=memory-service-analytics
