name: search-conversations

# Measures per-request latency for POST /v1/conversations/search under load.
# Each VU session issues two search requests:
#   1. Page 1  — no cursor      (measures cold-start / first-page latency)
#   2. Deep page — pre-fetched cursor from deep-search.csv
#                                (measures deep-page latency without a live cursor chain)
#
# deep-search.csv is generated by manifest-to-csv.go.  It contains only
# owners that have ≥3 search-result pages (limit=5), so every deep-page
# request is guaranteed to use a valid cursor.
# SLO: p99 < 5000ms per request (dev-laptop SLO; production target is 1000ms —
# vector+fulltext search is CPU/IO-bound and slow under concurrent load on a
# single-node dev machine).
#
# Uses always (fixed VU count) with 5 VUs rather than constantRate so session
# count stays bounded — constantRate accumulates sessions when requests are slow,
# exhausting the connection pool and inflating latency artificially.
# Postgres CPU rapidly on a single-node dev machine.
#
# deep-search.csv has THREE columns:
#   col 0 — ownerID (placeholder, equals col 1)
#   col 1 — ownerID
#   col 2 — deepCursor (search cursor pointing into page 3+ of results)

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 40
    useHttpCache: false

phases:
  - searchLoad:
      always:
        users: 5
        duration: 60s
        scenario:
          - searchAndPage:
              - randomCsvRow:
                  file: ../results/deep-search.csv
                  columns:
                    0: conversationId
                    1: ownerID
                    2: deepCursor

              # Page 1 — no cursor
              - httpRequest:
                  POST: /v1/conversations/search
                  headers:
                    Content-Type: application/json
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  body: |
                    {"query":"load test","limit":5}
                  metric: search-conversations

              # Deep page — pre-fetched cursor, always a valid interior page
              - httpRequest:
                  POST: /v1/conversations/search
                  headers:
                    Content-Type: application/json
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  body: |
                    {"query":"load test","limit":5,"afterCursor":"${deepCursor}"}
                  metric: search-conversations
