name: search-conversations

# Measures per-request latency for POST /v1/conversations/search under load.
# Each VU session issues one search request.  The constantRate phase drives
# a fixed arrival rate for sustained throughput measurement.
# Pagination correctness is covered by the Go correctness tests.
# SLO: p99 < 1000ms per request.
#
# conversation-ids.csv has TWO columns:
#   col 0 — conversationId
#   col 1 — ownerID (the user who created the conversation)
# Search is owner-scoped: we pick a random ownerID so each session searches
# against a user who has real indexed data.

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 20

phases:
  - searchLoad:
      constantRate:
        usersPerSec: 10
        duration: 60s
        maxSessions: 30
        scenario:
          - searchAndPage:
              - randomCsvRow:
                  file: ../results/conversation-ids.csv
                  columns:
                    0: conversationId
                    1: ownerID
              - httpRequest:
                  POST: /v1/conversations/search
                  headers:
                    Content-Type: application/json
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  body: |
                    {"query":"load-test","limit":5}
                  metric: search-conversations
