name: list-conversations

# Measures per-page request latency for GET /v1/conversations under load.
# Each VU session issues one page request.  The always phase loops VUs
# continuously so the steady-state measures sustained page-request throughput
# and latency — not pagination correctness (that is covered by the Go
# correctness tests in internal/loadtest/correctness/).
# SLO: p99 < 300ms per page request.
#
# conversation-ids.csv has TWO columns:
#   col 0 — conversationId
#   col 1 — ownerID (the user who created the conversation)
# We pick a random row to get ownerID, then list conversations for that owner
# so the request is authorised and returns real data.

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 40

phases:
  - listPages:
      always:
        users: 20
        duration: 90s
        scenario:
          - walkPages:
              - randomCsvRow:
                  file: ../results/conversation-ids.csv
                  columns:
                    0: conversationId
                    1: ownerID
              - httpRequest:
                  GET: /v1/conversations?mode=all&limit=20
                  headers:
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  metric: list-conversations-page
