name: list-conversations

# Measures per-page request latency for GET /v1/conversations under load.
# Each VU session issues two page requests:
#   1. Page 1  — no cursor      (measures cold-start / first-page latency)
#   2. Deep page — pre-fetched cursor from deep-conversations.csv
#                                (measures deep-page latency without a live cursor chain)
#
# deep-conversations.csv is generated by manifest-to-csv.go.  It contains
# only owners that have ≥5 pages (limit=20), so every deep-page request is
# guaranteed to use a valid cursor.
# SLO: p99 < 300ms per page request.
#
# deep-conversations.csv has THREE columns:
#   col 0 — conversationId
#   col 1 — ownerID
#   col 2 — deepCursor (cursor pointing into page 5+ of the owner's list)

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 40

phases:
  - listPages:
      always:
        users: 20
        duration: 90s
        scenario:
          - walkPages:
              - randomCsvRow:
                  file: ../results/deep-conversations.csv
                  columns:
                    0: conversationId
                    1: ownerID
                    2: deepCursor

              # Page 1 — no cursor
              - httpRequest:
                  GET: /v1/conversations?mode=all&limit=20
                  headers:
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  metric: list-conversations-page

              # Deep page — pre-fetched cursor, always a valid interior page
              - httpRequest:
                  GET: /v1/conversations?mode=all&limit=20&afterCursor=${deepCursor}
                  headers:
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  metric: list-conversations-page
