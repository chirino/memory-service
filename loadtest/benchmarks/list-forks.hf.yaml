name: list-forks

# GET /v1/conversations/{id}/forks on seeded fork root conversations.
# SLO: p99 < 300ms (checked in run.sh from exported JSON)
#
# fork-root-ids.csv has TWO columns:
#   col 0 — conversationId (fork root)
#   col 1 — ownerID (always loadtest-user-1, written by manifest-to-csv.go)
# We use ${ownerID} instead of a hardcoded username so the benchmark stays
# correct if fork ownership ever changes.

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 20

phases:
  - listForksLoad:
      always:
        users: 10
        duration: 60s
        scenario:
          - getForks:
              - randomCsvRow:
                  file: ../results/fork-root-ids.csv
                  columns:
                    0: conversationId
                    1: ownerID
              - httpRequest:
                  GET: /v1/conversations/${conversationId}/forks
                  headers:
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  metric: list-forks
