name: list-entries

# Measures per-page request latency for GET /v1/conversations/{id}/entries
# under load using long-tail conversations (>100 entries).
# Each VU session issues one page request.  The always phase loops VUs
# continuously for sustained throughput measurement.
# Pagination correctness is covered by the Go correctness tests.
# SLO: p99 < 300ms per page request.
#
# long-tail-conversation-ids.csv has TWO columns:
#   col 0 — conversationId
#   col 1 — ownerID (the user who created the conversation)
# We bind ownerID to X-User-ID so the server authorises the request.

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 40

phases:
  - walkEntries:
      always:
        users: 20
        duration: 90s
        scenario:
          - walkEntryPages:
              - randomCsvRow:
                  file: ../results/long-tail-conversation-ids.csv
                  columns:
                    0: conversationId
                    1: ownerID
              - httpRequest:
                  GET: /v1/conversations/${conversationId}/entries?limit=10
                  headers:
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  metric: list-entries-page
