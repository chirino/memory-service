name: list-entries

# Measures per-page request latency for GET /v1/conversations/{id}/entries
# under load using long-tail conversations (>100 entries).
# Each VU session issues two page requests:
#   1. Page 1  — no cursor      (measures cold-start / first-page latency)
#   2. Deep page — pre-fetched cursor from deep-entries.csv
#                                (measures deep-page latency without a live cursor chain)
#
# deep-entries.csv is generated by manifest-to-csv.go.  It contains only
# conversations that have ≥10 pages (limit=10), so every deep-page request
# is guaranteed to use a valid cursor.
# SLO: p99 < 300ms per page request.
#
# deep-entries.csv has THREE columns:
#   col 0 — conversationId
#   col 1 — ownerID
#   col 2 — deepCursor (cursor pointing into page 10+ of the conversation's entries)

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 40

phases:
  - walkEntries:
      always:
        users: 20
        duration: 90s
        scenario:
          - walkEntryPages:
              - randomCsvRow:
                  file: ../results/deep-entries.csv
                  columns:
                    0: conversationId
                    1: ownerID
                    2: deepCursor

              # Page 1 — no cursor
              - httpRequest:
                  GET: /v1/conversations/${conversationId}/entries?limit=10
                  headers:
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  metric: list-entries-page

              # Deep page — pre-fetched cursor, always a valid interior page
              - httpRequest:
                  GET: /v1/conversations/${conversationId}/entries?limit=10&afterCursor=${deepCursor}
                  headers:
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  metric: list-entries-page
