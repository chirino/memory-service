name: sse-fan-out

# SSE fan-out: measure append throughput while SSE subscribers are open.
#
# The openConnections phase used a Hyperfoil httpRequest with timeout:5s to
# attempt TTFB measurement.  Hyperfoil waits for the full response before
# timing the request; an SSE stream never sends a terminal response, so every
# request hit the 5s timeout and was marked failed.  That phase measured
# nothing except the timeout constant and produced 100% errors.
#
# SSE end-to-end delivery latency is measured correctly by the Go ssedelay
# benchmark (internal/loadtest/ssedelay) which holds real persistent
# connections and measures append→event latency at 1/10/50 concurrent users.
#
# This file now measures only append throughput under fan-out load.
#
# Routing note: SSE events are user-scoped.  appendBurst reads from
# sse-conversation-ids.csv which contains only conversations owned by
# loadtest-user-1, so every append is authorised and the resulting events
# are routed to any open subscribers for that user.
#
# CSV columns: col 0 = conversationId, col 1 = ownerID

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 20

phases:
  - appendBurst:
      always:
        users: 10
        duration: 60s
        scenario:
          - burstAppend:
              # sse-conversation-ids.csv contains ONLY conversations owned by
              # loadtest-user-1 (generated by manifest-to-csv.go).
              - randomCsvRow:
                  file: ../results/sse-conversation-ids.csv
                  columns:
                    0: conversationId
                    1: ownerID
              - httpRequest:
                  POST: /v1/conversations/${conversationId}/entries
                  headers:
                    Content-Type: application/json
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  body: |
                    {"contentType":"history","content":[{"role":"USER","text":"sse fan-out burst entry"}],"userId":"${ownerID}"}
                  metric: burst-append
